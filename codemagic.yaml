workflows:
  android-aab:
    name: Build Android AAB
    max_build_duration: 120
    environment:
      flutter: stable
    scripts:
      - name: Build Android AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
