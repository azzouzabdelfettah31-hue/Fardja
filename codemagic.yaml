workflows:
  android-apk:
    name: Build Android APK
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      groups:
        - google_play
    scripts:
      - ./gradlew :app:assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - your_email@gmail.com
